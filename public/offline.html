<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Culturosity</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: "Open Sans", system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 220px; height: auto; margin: 0 auto 20px; display: block; }
      p { color: #b4b4bf; max-width: 420px; margin: 0 auto 20px; line-height: 1.5; }
      button { background: #57f6c3; color: #000; border: 0; border-radius: 12px; font: inherit; font-weight: 600; padding: 12px 20px; min-height: 44px; cursor: pointer; }
      button:focus-visible { outline: 3px solid #d2f538; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/culturosity-logo.webp" alt="Culturosity" />
      <h1>You're offline</h1>
      <p>Perks, member cards and redemption codes need a connection so we can confirm your eligibility. Nothing is verified while offline.</p>
      <a href="/" style="display:inline-block;background:#57f6c3;color:#000;border-radius:12px;font-weight:600;padding:12px 20px;text-decoration:none">Try again</a>
    </main>
  </body>
</html>
